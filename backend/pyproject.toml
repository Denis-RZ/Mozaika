[project]
name = "mozaika-backend"
version = "0.1.0"
description = "Mosaic image generator backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "gunicorn>=23.0.0",
  "sqlalchemy>=2.0.37",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "pillow>=11.0.0",
  "numpy>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
mysql = [
  "pymysql>=1.1.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
