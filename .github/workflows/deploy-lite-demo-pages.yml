name: Deploy Lite Demo to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/dotnet-core-migration
    paths:
      - "docs/lite-demo/**"
      - ".github/workflows/deploy-lite-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p site/lite-demo
          cp -R docs/lite-demo/* site/lite-demo/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=./lite-demo/" />
            <title>Mozaika Lite Demo</title>
          </head>
          <body>
            <a href="./lite-demo/">Open Mozaika Lite Demo</a>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
